services:
  - type: web
    name: hospital-queueless-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: AVG_SERVICE_TIME_SECONDS
        value: 180
      - key: TOKEN_EXPIRY_SECONDS
        value: 3600
      - key: PATIENT_REGISTRATION_TTL_HOURS
        value: 12
      # CSV analytics writes to Render's ephemeral disk (fine for a pilot).
      # Switch to "mongo" and set MONGO_URI for a persistent event log.
      - key: ANALYTICS_SINK
        value: csv
      - key: ANALYTICS_CSV_PATH
        value: ../analytics/data/queue_events.csv
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM
        value: noreply@example.com
      # --- secrets: set these in the Render dashboard (Environment tab) ---
      - key: JWT_SECRET
        sync: false          # node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: AADHAAR_SALT
        sync: false          # node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false          # paste with the literal \n escapes, wrapped in quotes
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false          # your deployed frontend origin, e.g. https://<project-id>.web.app
      - key: FRONTEND_URL
        sync: false          # same as CORS_ORIGIN
      - key: ERROR_WEBHOOK_URL
        sync: false          # optional — Slack/Discord webhook for 5xx + client errors
      - key: ADMIN_RESET_ON_BOOT
        value: false         # flip to true + redeploy once to recover a locked-out admin
      # Only needed if ANALYTICS_SINK=mongo:
      # - key: MONGO_URI
      #   sync: false
