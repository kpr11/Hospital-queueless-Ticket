name: Frontend CI / Deploy

# ----------------------------------------------------------------------------
# CI (lint + build) runs on every push/PR.
#
# Deploy to Firebase Hosting runs on push to main IF two repo secrets exist:
#   FIREBASE_SERVICE_ACCOUNT  - the service-account JSON (same one the backend uses)
#   FIREBASE_HOSTING_ENV      - the production VITE_* env, one KEY=VALUE per line
# Missing either -> the deploy job skips cleanly (CI still gates the merge).
#
# Prefer Vercel? Connect the repo in the Vercel dashboard and delete the
# `deploy` job below - Vercel's GitHub integration handles it on its own.
# ----------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          # The build only needs these to be defined; deploy injects real values.
          VITE_API_BASE_URL: https://placeholder.example.com/api/v1
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_MEASUREMENT_ID: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_DATABASE_URL: https://placeholder.firebaseio.com
          VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: '0'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: matrix.node == '20'
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    name: Deploy to Firebase Hosting
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy secrets
        id: gate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENV: ${{ secrets.FIREBASE_HOSTING_ENV }}
        run: |
          if [ -z "$SA" ] || [ -z "$ENV" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT / FIREBASE_HOSTING_ENV not set — skipping Hosting deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build with production env
        if: steps.gate.outputs.go == 'true'
        working-directory: frontend
        run: |
          printf '%s\n' "${{ secrets.FIREBASE_HOSTING_ENV }}" > .env.production
          npm ci
          npm run build

      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting --project hospital-queueless-dev --non-interactive
